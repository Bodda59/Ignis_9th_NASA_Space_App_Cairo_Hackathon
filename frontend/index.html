<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flame in Freefall</title>
    <meta name="description" content="Fire-safety insights from NASA microgravity combustion research." />
    <meta name="theme-color" content="#08090e" />
    <script>
      // Apply the saved light/dark theme before first paint (see src/lib/theme.ts).
      // Kids Lab is always dark, so it is skipped.
      try {
        if (localStorage.getItem('flame-in-freefall:theme') === 'light' && !/^\/kids(\/|$)/.test(location.pathname)) {
          document.documentElement.dataset.theme = 'light'
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#c5cedd')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
