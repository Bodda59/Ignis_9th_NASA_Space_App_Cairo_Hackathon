# Every push to main: check the code, build one image, test it, and roll it out
# to Azure Container Apps. A failed step stops the deploy; the live site keeps
# running the previous revision.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
# Login uses OpenID Connect, so no Azure password is stored here. App secrets
# (database URL, API keys) live only on the Container App.
name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: flamefreefall123.azurecr.io
  IMAGE: flame-in-freefall
  RESOURCE_GROUP: rg-flame-freefall
  CONTAINER_APP: flame-in-freefall

jobs:
  lint:
    name: Lint frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint

  deploy:
    name: Build, test and deploy
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (frontend build included)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Backend tests inside the image
        run: docker run --rm ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }} python -m unittest discover -s research

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Push image
        run: |
          az acr login --name "${REGISTRY%%.*}"
          docker tag "$REGISTRY/$IMAGE:$GITHUB_SHA" "$REGISTRY/$IMAGE:latest"
          docker push "$REGISTRY/$IMAGE:$GITHUB_SHA"
          docker push "$REGISTRY/$IMAGE:latest"

      - name: Roll out the new revision
        run: |
          az containerapp update --name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP" \
            --image "$REGISTRY/$IMAGE:$GITHUB_SHA" --output none

      - name: Smoke test
        run: |
          host=$(az containerapp show --name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn --output tsv)
          echo "Site: https://$host"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 20 "https://$host/health" > /dev/null \
              && curl --fail --silent --max-time 20 "https://$host/" | grep -q '<div id="root">'; then
              echo "Healthy after $attempt checks."
              exit 0
            fi
            sleep 10
          done
          echo "The new revision did not become healthy within 5 minutes."
          exit 1
